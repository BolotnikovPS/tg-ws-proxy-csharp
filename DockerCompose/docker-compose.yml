# Образ с Docker Hub: https://hub.docker.com/r/pboldev/tg-ws-proxy

# Конфигурация хранится в файле на хосте и переживает пересоздание контейнера (F-6.6, F-6.8).
# Каталог ./config монтируется в /app/config; путь к файлу приложение берёт из TGWS_CONFIG.
#
# Подготовка каталога (UID 1654 — непривилегированный пользователь app в образе):
#   mkdir -p config
#   cp ../DockerCompose/config.docker.json config/config.json
#   sudo chown -R 1654:1654 config
#
# Единственный источник настроек — config.json (F-6.9): флаги в command: не передаются,
# правки делаются на странице панели или в самом файле. Слушатели всегда привязаны ко всем
# интерфейсам (0.0.0.0), поэтому прокси и панель доступны извне (F-6.4) —
# готовый образец лежит в DockerCompose/config.docker.json.
#
# TG_PORT — порт публикации локального MTProto-сервера (по умолчанию 1443, как в upstream).
# TG_WEB_PROXY_PORT — порт публикации WEB proxy наружу (по умолчанию 443; внутри — webProxy.port).
# Панель (Web API и метрики) всегда слушает все интерфейсы на порту 80, отдельно не настраивается.
# Порты внутри контейнера задаёт config.json ("port"); при их изменении
# поправьте правую часть в ports:.
# При проблемах только в Docker см. README и оверлеи:
#   docker-compose.mtu.yml | docker-compose.dns.yml | docker-compose.host.yml (Linux)

services:
  tg-ws-proxy:
    container_name: tg-ws-proxy
    image: pboldev/tg-ws-proxy:3.2.0-beta2
    restart: unless-stopped
    ports:
      - "${TG_PORT:-1443}:1443"
      # Web API и информационная панель. Слушает все интерфейсы на порту 80.
      # Публикуйте только вместе с webApiToken, иначе любой, кто дотянется до порта,
      # сможет читать метрики и менять конфиг.
      - "8081:80"
      # WEB proxy (browser-relay bridge). Снаружи — стандартный HTTPS 443; внутри
      # контейнера слушаем непривилегированный 8443, т.к. образ работает под нерутом
      # (USER $APP_UID) и порты <1024 ему недоступны. Правое число обязано совпадать
      # с webProxy.port в config.json.
      - "${TG_WEB_PROXY_PORT:-443}:8443"
    environment:
      TGWS_CONFIG: /app/config/config.json
    volumes:
      # Bind-mount: файл конфигурации лежит на хосте и переживает down/up.
      - ./config:/app/config
      # Альтернатива — именованный том (раскомментируйте и уберите строку выше,
      # если не нужен доступ к файлу с хоста):
      # - tg-ws-proxy-config:/app/config
      # Сертификат WEB proxy (pfx), read-only. Путь в config.json: /app/certs/pboldev.pfx.
      # ./certs — каталог certs в корне репозитория (относительно каталога DockerCompose/).
      - ./certs:/app/certs:ro
      # Логи в файл (logs.path). Раскомментируйте, задайте в config.json
      # "logs": { "path": "/app/log/tgwsproxy.jsonl" } и подготовьте каталог на хосте:
      #   mkdir -p log && sudo chown -R 1654:1654 log
      # - ./log:/app/log
    # HEALTHCHECK образа сам обращается к /healthz/ready на порту 80 (F-6.5),
    # поэтому дополнительных переменных не требуется.

# volumes:
#   tg-ws-proxy-config:
