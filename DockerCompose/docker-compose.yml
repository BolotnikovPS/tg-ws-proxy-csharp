# Образ с Docker Hub: https://hub.docker.com/r/pboldev/tg-ws-proxy

# TG_PORT — порт локального MTProto-сервера (по умолчанию 1443, как в upstream).
# При проблемах только в Docker см. README и оверлеи:
#   docker-compose.mtu.yml | docker-compose.dns.yml | docker-compose.host.yml (Linux)

services:
  tg-ws-proxy:
    container_name: tg-ws-proxy
    image: pboldev/tg-ws-proxy:2.3
    restart: unless-stopped
    ports:
      - "${TG_PORT:-1443}:${TG_PORT:-1443}"
    command:
      - "--host"
      - "${TG_HOST:-0.0.0.0}"
      - "--port"
      - "${TG_PORT:-1443}"
      - "--dc-ip"
      - "${TG_DC_IP_1:-2:149.154.167.220}"
      - "--dc-ip"
      - "${TG_DC_IP_2:-4:149.154.167.220}"
      # Чтобы включить логирование в файл с ротацией:
      # - "--log-file"
      # - "/var/log/tg-ws-proxy/proxy.log"
      #
      # Подробный лог:
      # - "--verbose"
      #
      # Свой MTProto-секрет (ровно 32 hex-символа); без него секрет генерируется при старте:
      # - "--secret"
      # - "f43b08aef31a50b7b92c17f07bb66b11"
      #
      # Свои Cloudflare-домены (можно несколько раз) и Worker-домены:
      # - "--cfproxy-domain"
      # - "example.com"
      # - "--cfproxy-worker-domain"
      # - "worker.example.workers.dev"
      #
      # Fake TLS (ee-secret) маскировка под указанный домен:
      # - "--fake-tls-domain"
      # - "www.microsoft.com"
      #
      # Отключить HTTP/2 мультиплексирование media через Cloudflare:
      # - "--no-h2"
